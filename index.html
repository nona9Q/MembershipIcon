<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メンシプ猫アイコンメーカー</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 20px;
    color: #333;
}

h1 { margin-bottom: 20px; font-size: 24px; }

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    max-width: 600px;
    width: 100%;
}

.controls {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.btn-group {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 10px;
}

input[type="file"] {
    padding: 10px;
    border: 2px dashed #ddd;
    border-radius: 8px;
    width: 100%;
    box-sizing: border-box;
    cursor: pointer;
}

button {
    padding: 10px 20px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
}

#dlPng { background-color: #007bff; color: white; }
#dlPng:hover { background-color: #0056b3; }

#dlIco { background-color: #28a745; color: white; }
#dlIco:hover { background-color: #1e7e34; }

canvas {
    border: 1px solid #ddd;
    border-radius: 4px;
    background-image: linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%),
                      linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    max-width: 100%;
    height: auto;
    margin-top: 10px;
}

.note {
    font-size: 12px;
    color: #666;
    margin-top: 5px;
}
</style>
</head>
<body>

<div class="container">
    <h1>メンシプ猫アイコンメーカー</h1>
    
    <div class="controls">
        <label>画像を選択してください:</label>
        <input type="file" id="imgInput" accept="image/*">
        
        <div class="btn-group">
            <button id="dlPng">PNGで保存</button>
            <button id="dlIco">ICOで保存</button>
        </div>
        <p class="note">※ICOは高画質アイコンにできます</p>
    </div>

    <canvas id="canvas" width="500" height="500"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let imgBack = new Image();
let imgUser = new Image();

let backLoaded = false;
let userLoaded = false;

imgBack.crossOrigin = "Anonymous"; 
imgBack.src = 'back.png'; 

imgBack.onload = () => { 
    backLoaded = true; 
    draw(); 
};
imgBack.onerror = () => {
    alert('エラー: back.png が読み込めません。HTMLと同じ場所に置いてください。');
};

document.getElementById('imgInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        imgUser = new Image();
        imgUser.onload = () => { 
            userLoaded = true; 
            draw(); 
        };
        imgUser.src = URL.createObjectURL(file);
    }
});

function roundRect(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
}

function draw() {
    ctx.clearRect(0, 0, 500, 500);

    if (!backLoaded) return;

    const backH = 500;
    const backW = imgBack.width * (backH / imgBack.height);
    const backX = (500 - backW) / 2;

    if (userLoaded) {
        const targetSize = 361.36; 
        const userX = (500 - targetSize) / 2;
        const userY = 500 - 10.84 - targetSize;

        const sSize = Math.min(imgUser.width, imgUser.height);
        const sx = (imgUser.width - sSize) / 2;
        const sy = (imgUser.height - sSize) / 2;

        ctx.save();
        roundRect(ctx, userX, userY, targetSize, targetSize, 54);
        ctx.clip();
        ctx.drawImage(imgUser, sx, sy, sSize, sSize, userX, userY, targetSize, targetSize);
        ctx.restore();
    }

    ctx.drawImage(imgBack, backX, 0, backW, backH);
}

document.getElementById('dlPng').addEventListener('click', () => {
    if(!checkReady()) return;
    const link = document.createElement('a');
    link.download = 'cat_icon.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
});

document.getElementById('dlIco').addEventListener('click', async () => {
    if(!checkReady()) return;

    const icoCanvas = document.createElement('canvas');
    icoCanvas.width = 256;
    icoCanvas.height = 256;
    const icoCtx = icoCanvas.getContext('2d');
    
    icoCtx.drawImage(canvas, 0, 0, 256, 256);

    icoCanvas.toBlob(async (blob) => {
        const fileData = await createIcoFile(blob);
        const link = document.createElement('a');
        link.download = 'cat_icon.ico';
        link.href = URL.createObjectURL(fileData);
        link.click();
    }, 'image/png');
});

function checkReady() {
    if (!backLoaded) {
        alert('背景画像(back.png)が読み込まれていません');
        return false;
    }
    return true;
}

async function createIcoFile(pngBlob) {
    const pngBuffer = await pngBlob.arrayBuffer();
    const pngData = new Uint8Array(pngBuffer);
    const size = pngData.length;

    const header = new Uint8Array(22);
    const view = new DataView(header.buffer);

    view.setUint16(0, 0, true); 
    view.setUint16(2, 1, true); 
    view.setUint16(4, 1, true); 

    view.setUint8(6, 0);   
    view.setUint8(7, 0);   
    view.setUint8(8, 0);   
    view.setUint8(9, 0);   
    view.setUint16(10, 1, true);  
    view.setUint16(12, 32, true); 
    view.setUint32(14, size, true); 
    view.setUint32(18, 22, true);   

    const icoBlob = new Blob([header, pngData], { type: 'image/x-icon' });
    return icoBlob;
}
</script>
</body>
</html>
